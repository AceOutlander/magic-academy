<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23606e">
<title>Bulwark — Base Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --world:#2f7f90; --world-deep:#1f5f6e;
  --panel:#2b2438; --panel-2:#3a3150; --edge:#150f1c;
  --ink:#fff8e8; --ink-dim:#cdbfdc; --warn:#ffab9c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --world:#16414c; --world-deep:#0d2c34; --panel:#221c2d; --panel-2:#322a44; }
}
:root[data-theme="dark"]{ --world:#16414c; --world-deep:#0d2c34; --panel:#221c2d; --panel-2:#322a44; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--world);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:800;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:linear-gradient(var(--world),var(--world-deep))}
.onyxmode #game{background:linear-gradient(#3a1e22,#160a0c)}
.d{font-family:'Lilita One','Trebuchet MS',system-ui,sans-serif;font-weight:400;letter-spacing:.3px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:none;background:none;padding:0}
button:focus-visible{outline:3px solid #ffe07a;outline-offset:2px}
.sh{text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 3px rgba(0,0,0,.55)}
[hidden]{display:none!important}

/* resource icons */
.ci,.gi{display:inline-block;width:14px;height:14px;vertical-align:-2px;flex:none;position:relative}
.ci{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c2 0 14%,#ffd84d 36%,#dd9d17 78%);border:1.5px solid #6b4306}
.gi::before{content:'';position:absolute;inset:2px;transform:rotate(45deg);border-radius:2px;background:linear-gradient(135deg,#f3d9ff,#c77dff 45%,#7b2cbf);border:1.5px solid #3c0f66}

/* top HUD */
#hudTop{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);pointer-events:none}
#hudTop>*{pointer-events:auto}
.res{display:flex;align-items:center;margin-bottom:7px}
.res .big{width:30px;height:30px;margin-right:-12px;z-index:2}
.res .big.gi::before{inset:4px;border-width:2px;border-radius:4px}
.res .big.ci{border-width:2px}
.bar{position:relative;width:clamp(118px,36vw,210px);height:24px;border-radius:12px;background:rgba(12,6,20,.6);border:2px solid rgba(0,0,0,.65);overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .35s}
.gold .fill{background:linear-gradient(#ffe68a,#f5b820 60%,#cf8a0c)}
.crystal .fill{background:linear-gradient(#ecc6ff,#b861f5 60%,#8a2ed1)}
.bar .txt{position:absolute;inset:0;white-space:nowrap;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:0 9px 0 16px;font-size:14px}
.bar .cap{font-size:10.5px;opacity:.8}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{display:flex;align-items:center;gap:6px;min-height:30px;padding:2px 11px 2px 7px;border-radius:14px;background:rgba(12,6,20,.6);border:2px solid rgba(0,0,0,.65);font-size:15px}
.pill .em{font-size:15px}
.iconbtn{width:38px;height:36px;justify-content:center;padding:0;font-size:17px}

/* big round buttons */
.round{position:fixed;z-index:6;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:78px;height:78px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--edge);box-shadow:0 6px 0 var(--edge),inset 0 3px 0 rgba(255,255,255,.4),inset 0 -6px 0 rgba(0,0,0,.18);transition:transform .07s}
.round:active{transform:translateY(4px);box-shadow:0 2px 0 var(--edge),inset 0 3px 0 rgba(255,255,255,.4),inset 0 -6px 0 rgba(0,0,0,.18)}
.round .em{font-size:30px;line-height:1}
.round .lbl{font-size:16px;margin-top:3px}
#shopBtn{left:calc(env(safe-area-inset-left,0px) + 14px);background:linear-gradient(#ffd65c,#e39515)}
#raidBtn{right:calc(env(safe-area-inset-right,0px) + 14px);background:linear-gradient(#ff8466,#cf3320)}
.badge{position:absolute;top:-10px;right:-8px;background:#241a30;border:2px solid var(--edge);border-radius:10px;font-size:12px;padding:1px 7px}

/* 3D buttons */
.btn{flex:1 1 auto;min-width:78px;padding:8px 8px 7px;border-radius:13px;border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--edge),inset 0 2px 0 rgba(255,255,255,.35);background:linear-gradient(#86e05d,#3c9f21);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1;font-family:'Lilita One',system-ui,sans-serif;font-size:16px;transition:transform .07s}
.btn small{font-family:'Nunito',system-ui,sans-serif;font-weight:900;font-size:12px;display:flex;align-items:center;gap:4px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge),inset 0 2px 0 rgba(255,255,255,.35)}
.btn:disabled{filter:grayscale(.8) brightness(.75);cursor:not-allowed}
.btn.red{background:linear-gradient(#ff8466,#cf3320)}
.btn.gold{background:linear-gradient(#ffe07a,#e3a317)}
.btn.blue{background:linear-gradient(#72c3ff,#2b7bd0)}
.btn.plain{background:linear-gradient(#5b4f72,#3f3552)}

/* selection panel */
#sel{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 106px);width:min(94vw,440px);background:var(--panel);border:3px solid var(--edge);border-radius:18px;padding:11px 13px 13px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
@media (min-width:720px){#sel{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}}
.sel-top{display:flex;gap:10px;align-items:center}
.pv-cur{width:68px;height:50px;flex:none;border-radius:12px;background:rgba(0,0,0,.2)}
.sel-info{flex:1;min-width:0}
.btn.up{flex:2 1 auto;flex-direction:row;justify-content:center;gap:6px}
.btn .pv{width:46px;height:33px;flex:none}
.btn .bt{display:flex;flex-direction:column;align-items:center;gap:2px}
.hint.stack{color:#ffe07a}
.sel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sel-title{font-size:21px}
.lvl{font-size:13px;background:var(--panel-2);padding:3px 9px;border-radius:9px;color:var(--ink-dim);margin-left:6px;vertical-align:3px}
.x{width:32px;height:32px;border-radius:10px;background:var(--panel-2);font-size:15px;flex:none}
.stats{display:flex;flex-wrap:wrap;gap:3px 12px;margin:3px 0 9px;font-size:13px;color:var(--ink-dim)}
.stats b{color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--warn);margin-top:8px}
.hint{font-size:12px;color:var(--ink-dim);margin-top:8px;text-align:center;font-weight:700}
.prog{height:14px;border-radius:7px;background:rgba(0,0,0,.45);border:2px solid rgba(0,0,0,.55);overflow:hidden;margin:2px 0 9px;position:relative}
.prog i{display:block;height:100%;width:0;background:linear-gradient(#a8f585,#46b62a)}
.prog span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px}

/* shop */
.sheet{position:fixed;z-index:9;left:0;right:0;bottom:0;max-height:76vh;display:flex;flex-direction:column;background:var(--panel);border-top:3px solid var(--edge);border-radius:22px 22px 0 0;padding:12px calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 12px);transform:translateY(105%);transition:transform .22s ease-out;box-shadow:0 -12px 30px rgba(0,0,0,.4);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.shop-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tabs{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 12px;border-radius:12px;background:var(--panel-2);font-family:'Lilita One',system-ui,sans-serif;font-size:15px;color:var(--ink-dim);border:2px solid transparent}
.tab.on{background:linear-gradient(#ffd65c,#e39515);color:#3b2300;border-color:var(--edge)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;overflow-y:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--panel-2);border:2.5px solid var(--edge);border-radius:14px;padding:6px 9px 9px;box-shadow:0 3px 0 var(--edge)}
.card:active{transform:translateY(2px)}
.card canvas{width:100%;height:86px;display:block}
.card .nm{font-family:'Lilita One',system-ui,sans-serif;font-size:15.5px;margin-top:2px}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-top:3px}
.cost{display:flex;align-items:center;gap:4px}
.cost.short{color:#ff9a88}
.card .cnt,.card .tm{color:var(--ink-dim);font-size:12px}
.card.dim canvas,.card.dim .nm{opacity:.5}
.train-title{font-size:21px;flex:1}
#trainQueue{margin:-2px 0 10px}
.tq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,.2);border-radius:13px;padding:8px}
.tq .cur{display:flex;align-items:center;gap:8px;flex:1 1 180px;min-width:0}
.tq .cur canvas,.chip canvas{width:34px;height:34px;flex:none}
.tq .cur .prog{flex:1;margin:0}
.chip{display:flex;align-items:center;gap:3px;background:var(--panel-2);border:2px solid var(--edge);border-radius:11px;padding:2px 8px 2px 3px;font-size:13px}
.chip b{font-family:'Lilita One',system-ui,sans-serif;font-weight:400}
.chip .rm{color:#ff9a88;margin-left:3px;font-size:13px}
.army-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--ink-dim);align-items:center}
.army-row .lab{background:none;padding:0 4px 0 0}
.army-row span{background:rgba(0,0,0,.2);border-radius:9px;padding:3px 8px}
.army-row b{color:var(--ink)}
.card .house{color:#8fd3ff;font-size:12px}
.qempty{font-size:13px;color:var(--ink-dim);font-weight:700;padding:2px 2px}
.card .tag{position:absolute;top:64px;left:8px;right:8px;text-align:center;font-size:11.5px;background:rgba(0,0,0,.65);border-radius:8px;padding:3px 4px}

/* placement */
#place{position:fixed;z-index:8;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:center;align-items:center;gap:12px;pointer-events:none;padding:0 10px}
#place>*{pointer-events:auto}
.pbtn{width:64px;height:64px;border-radius:50%;font-size:28px;border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge),inset 0 3px 0 rgba(255,255,255,.35);flex:none}
.pbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.pbtn.ok{background:linear-gradient(#86e05d,#3c9f21)}
.pbtn.no{background:linear-gradient(#ff8466,#cf3320)}
.phint{background:rgba(12,6,20,.78);border:2px solid rgba(0,0,0,.6);padding:8px 12px;border-radius:13px;font-size:13px;max-width:min(56vw,320px);text-align:center;line-height:1.3}

/* raid */
#raidHud{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 120px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;white-space:nowrap;background:rgba(12,6,20,.75);border:2px solid rgba(0,0,0,.7);border-radius:15px;padding:6px 15px;font-size:19px}
@media (min-width:640px){#raidHud{top:calc(env(safe-area-inset-top,0px) + 12px)}}
.stars span{color:#5b5366}
.stars span.on{color:#ffd23f;text-shadow:0 0 8px rgba(255,210,63,.6)}
#cmdBtn{left:50%;margin-left:-39px;background:linear-gradient(#72c3ff,#2b7bd0)}
#cmdBtn.raid{left:calc(env(safe-area-inset-left,0px) + 14px);margin-left:0}
#cmd{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 106px);width:min(96vw,520px);background:var(--panel);border:3px solid var(--edge);border-radius:18px;padding:9px 10px 10px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
#cmd.raid{bottom:calc(env(safe-area-inset-bottom,0px) + 92px)}
.cmd-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.cmd-hint{flex:1;font-size:13px;color:var(--ink-dim);line-height:1.25}
.cmd-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;-webkit-overflow-scrolling:touch}
.cchip{flex:none;display:flex;align-items:center;gap:3px;background:var(--panel-2);border:2.5px solid var(--edge);border-radius:12px;padding:2px 9px 2px 3px;font-family:'Lilita One',system-ui,sans-serif;font-size:14px;min-height:42px}
.cchip canvas{width:34px;height:34px;flex:none}
.cchip.on{border-color:#ffd65c;background:#4d3f1a;box-shadow:0 0 0 2px rgba(255,214,92,.35)}
.cchip .flag{font-size:11px;margin-left:2px}
.cmd-acts{display:flex;gap:8px;margin-top:6px}
.cmd-acts .btn{padding:8px 6px;font-size:14px;min-width:0}
.tr-head{grid-column:1/-1;font-family:'Lilita One',system-ui,sans-serif;font-size:16px;margin:6px 2px 0}
.tr-head i{font-family:'Nunito',system-ui,sans-serif;font-style:normal;font-weight:700;font-size:12px;color:var(--ink-dim);margin-left:6px}
.card .lvtag{font-size:12px;color:#ffd65c;margin-left:4px}
.card .up{font-size:12px;color:#9ff07a}
#deploy{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(96vw,560px);background:var(--panel);border:3px solid var(--edge);border-radius:18px;padding:9px 10px 10px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.dep-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.dep-hint{flex:1;font-size:12.5px;color:var(--ink-dim);line-height:1.3}
.dep-boat{color:#9fd8ff;font-weight:900}
.dep-end{flex:0 0 auto;min-width:0;padding:8px 12px;font-size:14px}
.cchip.out{opacity:.45}
.attacking #hudTop{display:none}
#raidHud .ah{display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
#raidHud .ah1{font-size:15px}
#raidHud .ah2{display:flex;gap:12px;font-size:17px}
.btn.onyx{background:linear-gradient(#4a4550,#221f27);color:#ffdada;border-color:#000;box-shadow:0 4px 0 #000,inset 0 2px 0 rgba(255,255,255,.12)}
.bossbar.mini{width:160px;height:12px}
.bossbar.mini i{background:linear-gradient(#ff5a6a,#a01a2a)}
.bossbar.mini span{font-size:9px;line-height:9px}
.bossbar{position:relative;width:220px;height:16px;border-radius:8px;background:rgba(0,0,0,.5);border:2px solid #000;overflow:hidden;margin-top:3px}
.bossbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#d06aff,#7b2cbf)}
.bossbar span{position:relative;z-index:1;font-size:11px;display:block;text-align:center;line-height:12px}
.bot-tag{font-size:11px;background:#5b5170;border-radius:6px;padding:1px 6px;vertical-align:middle;letter-spacing:.5px}
.searching{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#ffd65c;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boat-row{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:14px;padding:10px 12px;text-align:left}
.boat-row .tx{flex:1;min-width:0}
.boat-row b{font-size:15px}
.boat-row i{display:block;font-style:normal;font-size:12.5px;color:var(--ink-dim)}
.boat-row .btn{flex:0 0 auto;min-width:88px;padding:8px 10px;font-size:14px}
#raidCtl{position:fixed;z-index:6;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:8px}
#raidCtl .btn{min-width:74px;padding:11px 10px}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:20;background:rgba(8,4,14,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{width:min(92vw,380px);background:var(--panel);border:3px solid var(--edge);border-radius:22px;padding:18px 18px 16px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mbox h2{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:29px;margin:2px 0 6px}
.binfo-pic{display:block;width:100%;height:150px;margin:-4px 0 2px}
.binfo-text{text-align:left;font-weight:700;font-size:14.5px;line-height:1.45;color:var(--ink);margin:6px 0 10px}
.binfo-tip{text-align:left;font-weight:700;font-size:13px;line-height:1.4;color:#ffe07a;background:rgba(255,214,92,.1);border:1.5px solid rgba(255,214,92,.3);border-radius:12px;padding:8px 10px;margin:0 0 10px}
.binfo-stats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.binfo-stats span{background:var(--panel-2);border-radius:10px;padding:5px 9px;font-size:12.5px;color:var(--ink-dim)}
.binfo-stats b{color:var(--ink)}
.binfo-why{color:var(--warn);font-size:13px;font-weight:800;margin:-4px 0 10px}
.mbox{max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch}
.lb-score-big{font-size:40px;line-height:1;margin:2px 0 8px}
.lb-score-big small{font-size:16px;color:var(--ink-dim)}
.lb-tip{font-size:12px;color:var(--ink-dim);font-weight:700;margin:2px 0 10px}
.lb-warn{font-size:12.5px;color:var(--warn);font-weight:800;margin:0 0 10px}
.lb-form{display:flex;gap:8px;margin-bottom:12px}
.lb-form input{flex:1;margin:0;min-width:0}
.lb-form .btn{flex:0 0 auto;min-width:96px}
.lb-list{display:flex;flex-direction:column;gap:4px;text-align:left}
.lb-row{display:grid;grid-template-columns:44px 1fr auto auto;gap:8px;align-items:center;background:var(--panel-2);border-radius:10px;padding:6px 9px;font-size:13.5px}
.lb-row.me{outline:2px solid #ffd65c;background:#4a3d1c}
.lb-rank{font-family:'Lilita One',system-ui,sans-serif;font-size:15px}
.lb-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-meta{font-size:11.5px;color:var(--ink-dim)}
.lb-score{font-family:'Lilita One',system-ui,sans-serif;font-size:15px;color:#ffd65c}
.lb-note{font-size:13px;color:var(--ink-dim);font-weight:700;padding:10px;background:rgba(0,0,0,.2);border-radius:10px}
.lb-remove{display:block;margin:12px auto 0;padding:8px 12px;font-size:13px;font-weight:800;color:#ff8f7d;text-decoration:underline;text-underline-offset:3px}
.lb-off{font-size:12.5px;color:var(--ink-dim);font-weight:800;margin:0 0 10px}
.lb-dev{margin-top:10px;font-size:12.5px;color:var(--ink-dim);text-align:left}
.lb-dev summary{cursor:pointer;padding:4px 0}
/* settings */
.mbox.set-box{padding:14px 14px 12px;text-align:left}
.set-top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
.set-top h2{margin:0;font-size:26px;text-shadow:none;letter-spacing:.3px}
.set-x{width:40px;height:40px;border-radius:12px;background:var(--panel-2);font-size:17px;color:var(--ink);border:2px solid rgba(255,255,255,.08)}
.set-h{font-size:12px;font-weight:900;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-dim);margin:14px 6px 6px}
.set-sec{background:var(--panel-2);border-radius:16px;overflow:hidden;border:1.5px solid rgba(255,255,255,.06)}
.set-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:9px 14px;text-align:left;color:var(--ink);font-family:'Nunito',system-ui,sans-serif}
.set-row+.set-row{border-top:1.5px solid rgba(0,0,0,.28)}
.set-row:active{background:rgba(255,255,255,.06)}
.set-row .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(0,0,0,.25);flex:none}
.set-row .tx{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.set-row .tx b{font-weight:900;font-size:15.5px;line-height:1.2}
.set-row .tx i{font-style:normal;font-weight:700;font-size:12.5px;color:var(--ink-dim);line-height:1.3}
.set-row .chev{font-size:22px;color:var(--ink-dim);flex:none;margin-right:-2px}
.sw{position:relative;width:48px;height:28px;border-radius:14px;background:#5b5170;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s}
.sw.on{background:#46b62a}
.sw.on::after{transform:translateX(20px)}
.set-sec.danger{border-color:rgba(232,74,58,.35)}
.set-row.red .tx b{color:#ff8f7d}
.set-row.red .ic{background:rgba(232,74,58,.18)}
.set-foot{text-align:center;margin:14px 0 2px}
.set-foot .ver{margin:0}
.mbox.confirm-box h2{text-shadow:none}
.mbox .ver{font-size:12px;color:var(--ink-dim);opacity:.6;margin:12px 0 0;cursor:default;user-select:none}
.mbox input.pin{width:100%;margin:8px 0 12px;padding:11px 12px;border-radius:12px;border:2.5px solid var(--edge);background:var(--panel-2);color:var(--ink);font:inherit;font-size:16px}
.devtag{position:fixed;z-index:6;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);background:#c0392b;color:#fff;border:2px solid #000;border-radius:9px;padding:1px 9px;font-size:12px;letter-spacing:.5px;pointer-events:none}
.mbox p{font-weight:700;color:var(--ink-dim);font-size:14px;line-height:1.45;margin:6px 0}
.mbox .tips{text-align:left;margin:10px 0 14px;display:grid;gap:8px}
.mbox .tips div{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:14px;line-height:1.35;color:var(--ink)}
.mbox .tips .em{font-size:20px;line-height:1.1;flex:none;width:26px;text-align:center}
.bigstars{font-size:46px;letter-spacing:6px;margin:4px 0}
.loot{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:18px;margin:8px 0 14px}
.loot span{white-space:nowrap;display:flex;align-items:center;gap:6px}
.loot .ci,.loot .gi{width:18px;height:18px}
.mrow{display:flex;gap:8px}
.stepper{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 8px}
.step{width:44px;height:44px;border-radius:13px;background:var(--panel-2);border:2.5px solid var(--edge);box-shadow:0 3px 0 var(--edge);font-family:'Lilita One',system-ui,sans-serif;font-size:18px}
.step:disabled{opacity:.35}
.step:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.lvlbig{min-width:104px;font-size:30px;line-height:1.05;display:flex;flex-direction:column;align-items:center}
.lvlbig small{font-size:14px;margin-top:2px}
.wave{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:4px 0}
.wave span{background:var(--panel-2);border-radius:9px;padding:4px 9px;font-size:13px;color:var(--ink-dim)}
.wave b{color:var(--ink)}
.recline b{color:#ffe07a}
#toast{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top,0px) + 168px);transform:translate(-50%,-8px);max-width:86vw;text-align:center;background:rgba(12,6,20,.88);border:2px solid #000;padding:8px 15px;border-radius:13px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:640px){#toast{top:calc(env(safe-area-inset-top,0px) + 70px)}}

  const nice=v=>{if(v<100)return Math.round(v);const m=Math.pow(10,Math.floor(Math.log10(v))-1);return Math.round(v/m)*m;};
  const grow=(a,n,f,r)=>{while(a.length<n){const v=a[a.length-1]*f;a.push(r?r(v):v);}};
  for(const [t,T] of Object.entries(TYPES)){
    if(t==='hall'||t==='hut'||T.cat==='onyx')continue;
    const n=T.cat==='trap'?MAXT:MAXB;if(T.maxLvl>=n)continue;
    grow(T.cost,n,T.cat==='wall'?1.6:1.55,nice);
    grow(T.time,n,1.3,v=>Math.round(v/5)*5);
    grow(T.hp,n,T.cat==='wall'?1.25:1.12,Math.round);
    if(T.dmg)grow(T.dmg,n,T.cat==='trap'?1.22:1.17,v=>Math.round(v*10)/10);
    if(T.rate)grow(T.rate,n,1.25,v=>Math.round(v*10)/10);
    if(T.store)grow(T.store,n,1.35,nice);

function musicTick(){

  const war=!!raid&&!raid.ended,onyx=war&&!!raid.onyx,final=onyx&&raid.onyx.wave>=10&&!(raid.onyx.inter>0),spb=final?0.13:onyx?0.16:war?0.21:0.34;

    const i=musStep%16,bar=Math.floor(musStep/16),EQ=[[49,52,56],[45,49,52],[47,50,54],[48,52,55]],ch=EQ[bar%EQ.length];

      pluck(musT,ch[(i*2)%3]+24+(i%8===7?1:0),0.08,spb*0.7);
      if(bar%4===3&&i===0)tone(MUS,musT,mtof(ch[0]+12),spb*16,'sawtooth',0.05,mtof(ch[0]+24),0.2);
    }
    musT+=spb;musStep++;

    // D harmonic minor, driving 16ths: pounding drums, brass stabs on each chord, tremolo strings and wild runs
    const i=musStep%16,bar=Math.floor(musStep/16),ONX=[[50,53,57],[46,50,53],[49,52,55],[50,53,57],[43,46,50],[45,49,52],[46,50,53],[45,49,52]],ch=ONX[bar%ONX.length];

      if(Math.random()<0.12)pluck(musT+spb*0.5,ch[Math.floor(Math.random()*3)]+36,0.05,spb*0.6);
    }
    musT+=spb;musStep++;
  }
  while(!onyx&&!final&&musT<AC.currentTime+0.45){
    const i=musStep%8,ch=MUS_CH[Math.floor(musStep/8)%MUS_CH.length];
    if(AUD.music){
      if(i===0){drone(musT,ch[0]-24,spb*8,0.22);drone(musT,ch[2]-12,spb*8,0.06);}
      const pat=[0,1,2,1,0,2,1,2],n=ch[pat[i]]+(i>=4?12:0);

// and blended lightly into main roofs and walls so each stage reads as its own without repainting the whole building.

function makeWave(lvl){

    if(p.k==='shell'||p.k==='rock'){p.t+=dt;const f=Math.min(1,p.t/p.T);p.x=p.sx+(p.lx-p.sx)*f;p.y=p.sy+(p.ly-p.sy)*f;p.z=(p.k==='rock'?50:36)*(1-f)+p.arc*4*f*(1-f);
      if(f>=1){p.done=true;boom(p.x,p.y,4,p.k==='rock'?48:34);snd('boom',p.x,p.y);if(p.k==='rock')puff(p.x,p.y,6,'#b8a88a');addFx({k:'ring',x:p.x,y:p.y,T:0.4,r:p.splash,c:'rgba(255,170,80,.9)'});
        for(const u of R.units){if(u.dead)continue;const d=Math.hypot(u.x-p.x,u.y-p.y);if(d<=p.splash)damageUnit(u,p.dmg*(1-0.4*d/p.splash));}}

    if(p.k==='bolt'){const st=p.sp*dt;p.x+=p.vx*st;p.y+=p.vy*st;p.left-=st;
      for(const u of R.units){if(u.dead||p.hit.has(u))continue;if(Math.hypot(u.x-p.x,u.y-p.y)<0.55){p.hit.add(u);damageUnit(u,p.dmg);}}
      if(p.left<=0||p.x<0||p.y<0||p.x>N||p.y>N)p.done=true;continue;}
    const tgt=p.tu||p.tt;let tx,ty,tz;

        for(const u of R.units){if(u.dead)continue;const dd=Math.hypot(u.x-tx,u.y-ty);if(dd<=p.splash)damageUnit(u,p.dmg*(1-0.3*dd/p.splash));}}
      else if(p.tu&&!p.tu.dead)damageUnit(p.tu,p.dmg,p.src);
      if(p.tt&&!p.tt.dead)damageTroop(p.tt,p.dmg);
      if(p.splash){for(const o of S.b){if(o.dead||isTrap(o)||o===p.tb)continue;if(distRect(p.x,p.y,o)<=p.splash)hitBuilding(o,p.dmg*0.5*(o.t==='wall'&&p.wallx?p.wallx:1));}for(const tr of troops)if(!tr.dead&&Math.hypot(tr.x-p.x,tr.y-p.y)<=p.splash)damageTroop(tr,p.dmg*0.5);boom(p.x,p.y,3,20);}
      if(p.tb&&!p.tb.dead){hitBuilding(p.tb,p.dmg*(p.tb.t==='wall'&&p.wallx?p.wallx:1));if(p.fire&&!p.tb.dead&&p.tb.t!=='wall'){p.tb.burn={t:3,dps:p.fire};}}

// ----- defenders in battle -----
function troopHit(tr,f,dmg){
  const d=tr.def;
  if(d.big&&f.type==='ogre')dmg*=d.big;
  if(d.charge&&tr.fresh){dmg*=d.charge;tr.fresh=false;addFx({k:'ring',x:f.x,y:f.y,T:0.35,r:0.9,c:'rgba(255,255,255,.9)'});}
  if(d.cleave){for(const u of raid.units){if(u.dead||u===f)continue;if(Math.hypot(u.x-f.x,u.y-f.y)<=d.cleave)damageUnit(u,dmg*0.6,tr);}
    addFx({k:'ring',x:f.x,y:f.y,T:0.3,r:d.cleave,c:'rgba(255,220,110,.9)'});}
  if(tr.range<=1.5)snd('clang',f.x,f.y);
  damageUnit(f,dmg,tr);
}
function troopWalk(tr,px,py,dt,mul,rng){
  if(clearLine(tr.x,tr.y,px,py,tr.home)){tr.path=null;return moveTo(tr,px,py,dt,mul);}
  tr.rp-=dt;
  if((!tr.path||tr.rp<=0)&&pathBudget>0){pathBudget--;tr.rp=1;tr.path=findPathTo(tr,px,py,rng||0.5,tr.home);tr.pi=0;}
  if(tr.path&&tr.pi<tr.path.length){const n=tr.path[tr.pi];if(moveTo(tr,n%N+.5,((n/N)|0)+.5,dt,mul))tr.pi++;return false;}
  return moveTo(tr,px,py,dt,mul);
}
function updateTroopRaid(tr,dt){
  if(tr.dead)return;
  const R=raid,d=tr.def;
  tr.cd-=dt;if(tr.hitFlash>0)tr.hitFlash-=dt;if(tr.swing>0)tr.swing-=dt;tr.moving=false;
  if(d.heal){tr.healT=(tr.healT||1)-dt;if(tr.healT<=0){tr.healT=1;let any=false;
    for(const o of troops)if(!o.dead&&o.hp<o.maxHp&&Math.hypot(o.x-tr.x,o.y-tr.y)<=3){o.hp=Math.min(o.maxHp,o.hp+d.heal*troopMulT(tr.type));any=true;}
    if(any)addFx({k:'ring',x:tr.x,y:tr.y,T:0.6,r:3,c:'rgba(255,225,120,.75)'});}}
  let o=tr.order;
  if(o&&o.k==='atk'&&o.u.dead){o=tr.order=null;}
  if(tr.foe&&tr.foe.dead)tr.foe=null;
  // pick who to fight, depending on the order
  let reach=13,ax=tr.x,ay=tr.y;
  if(o&&o.k==='hold'){ax=o.x;ay=o.y;reach=Math.max(4.5,tr.range+1.5);}
  else if(o&&o.k==='move')reach=Math.max(1.4,tr.range+0.3);
  if(o&&o.k==='atk'){if(tr.foe!==o.u){tr.foe=o.u;tr.path=null;tr.fresh=true;}}
  // a move or fall-back order is obeyed no matter who is fighting them: they stop attacking and go
  else if(o&&o.k==='move'){if(tr.foe){tr.foe=null;tr.path=null;}}
  else{
    tr.scan-=dt;
    if(tr.scan<=0){tr.scan=0.4;if(Math.random()<0.05)tr.bad=null;
      let best=null,bd=tr.foe?Math.hypot(tr.foe.x-tr.x,tr.foe.y-tr.y)-1.5:1e9;
      for(const u of R.units){if(u.dead||u===tr.bad)continue;if(Math.hypot(u.x-ax,u.y-ay)>reach)continue;const dd=Math.hypot(u.x-tr.x,u.y-tr.y);if(dd<bd){bd=dd;best=u;}}
      if(best&&best!==tr.foe){tr.foe=best;tr.path=null;tr.fresh=true;}}
    if(tr.foe&&Math.hypot(tr.foe.x-ax,tr.foe.y-ay)>reach+1.5)tr.foe=null;
  }
  const f=tr.foe;
  if(f){
    const dist=Math.hypot(f.x-tr.x,f.y-tr.y);faceP(tr,f.x,f.y);
    if(dist<=tr.range+0.15){
      if(tr.cd<=0){tr.cd=d.atk;const dmg=tr.dps*d.atk;
        if(tr.range>1.5){R.proj.push({k:tr.type==='longbow'?'larrow':'qbolt',x:tr.x,y:tr.y,z:18,tu:f,sp:tr.type==='longbow'?20:17,dmg,src:tr});tr.swing=0.15;}
        else{tr.swing=0.25;troopHit(tr,f,dmg);}}
      return;}
    if(clearLine(tr.x,tr.y,f.x,f.y,tr.home)){moveTo(tr,f.x,f.y,dt);return;}
    tr.rp-=dt;
    if((!tr.path||tr.rp<=0)&&pathBudget>0){pathBudget--;tr.rp=0.8;tr.path=findPathTo(tr,f.x,f.y,Math.max(0.6,tr.range*0.9),tr.home);tr.pi=0;
      if(!tr.path){tr.bad=f;tr.foe=null;if(o&&o.k==='atk')tr.order=null;return;}}
    if(tr.path&&tr.pi<tr.path.length){const n=tr.path[tr.pi];if(moveTo(tr,n%N+.5,((n/N)|0)+.5,dt))tr.pi++;}
    else tr.path=null;
    return;
  }
  // nobody to fight: go where we were told
  let dest,mul=0.8;
  if(o&&(o.k==='hold'||o.k==='move')){dest=spotNear(o.x,o.y,tr.fo||[0,0]);mul=o.k==='move'?1:0.8;}
  else dest=troopPost(tr);
  if(Math.hypot(dest[0]-tr.x,dest[1]-tr.y)>0.35){troopWalk(tr,dest[0],dest[1],dt,mul);}
  else if(o&&o.k==='move'){tr.order={k:'hold',x:o.x,y:o.y};tr.fresh=true;}
}
// shrines heal troops and mend buildings
function updateShrines(dt){
  for(const b of S.b){if(b.t!=='shrine'||b.dead||b.bk==='build')continue;
    b.cd=(b.cd||0)-dt;if(b.cd>0)continue;b.cd=1;
    const T=TYPES.shrine,L=b.lvl-1,[cx,cy]=centerOf(b),r=T.hr[L];let any=false;
    for(const tr of troops)if(!tr.dead&&tr.hp<tr.maxHp&&Math.hypot(tr.x-cx,tr.y-cy)<=r){tr.hp=Math.min(tr.maxHp,tr.hp+T.heal[L]);any=true;}
    for(const o of S.b){if(o.dead||!counts(o)||o.hp>=maxHp(o))continue;if(distRect(cx,cy,o)<=r){o.hp=Math.min(maxHp(o),o.hp+T.mend[L]);any=true;}}

function bossHitPoint(u,b){if(!b)return[u.x,u.y];const s=TYPES[b.t].size;return[clamp(u.x,b.x,b.x+s),clamp(u.y,b.y,b.y+s)];}

// ================= Onyx Trials =================
// Unlocked by beating raid 14. Ten waves back to back of grey-and-red Onyx soldiers. Defenses heal half their
// health between waves; your soldiers don't heal or come back. Beat all ten to win the two Onyx Vaults.
const ONYX_UNLOCK=[['bombardier',1],['vanguard',1],['blaster',3],['titan',5],['sentinel',7]];
function onyxBase(){return Math.max(14,Math.min(120,Math.round(recommended()*0.56)));}
function onyxQueue(w,spawns){
  const types=ONYX_UNLOCK.filter(e=>w>=e[1]).map(e=>e[0]),n=Math.min(48,9+Math.round(w*3.6)),q=[];
  const weight={bombardier:3,vanguard:4,blaster:3,titan:2,sentinel:1};
  const pool=[];for(const t of types)for(let i=0;i<weight[t];i++)pool.push(t);
  for(let i=0;i<n;i++){const t=i<types.length?types[i]:pool[Math.floor(Math.random()*pool.length)],sp=spawns[i%spawns.length];
    q.push({type:t,at:0.5+Math.floor(i/spawns.length)*0.55+(i%spawns.length)*0.15,x:clamp(sp[0]+(Math.random()-.5)*1.4,0.3,N-0.3),y:clamp(sp[1]+(Math.random()-.5)*1.4,0.3,N-0.3)});}
  if(w===10){const sp=spawns[0];q.push({type:'equalizer',at:3,x:clamp(sp[0],0.5,N-0.5),y:clamp(sp[1],0.5,N-0.5)});}
  return q.sort((a,b)=>a.at-b.at);
}
function onyxMul(R){const ws=waveSpec(Math.round(R.onyx.base+(R.onyx.wave-1)*1.0));R.hpMul=ws.hpMul;R.dmgMul=ws.dmgMul;}
function startOnyx(){
  if(raid)return;snd('horn');closeShop();closeTrain();cancelPlace();select(null);
  for(const b of S.b){b.hp=maxHp(b);b.dead=false;b.tgt=null;b.cd=Math.random()*0.5;b.sprung=false;b.fuse=null;}
  const nSp=4,spawns=[];for(let i=0;i<nSp;i++)spawns.push(edgePoint());
  raid={t:0,dur:150,countdown:3,units:[],queue:onyxQueue(1,spawns),total:0,proj:[],spawns,speed:1,kills:0,loot:0,tars:[],lost:{},sprung:0,
    totalB:S.b.filter(counts).length,destroyed:0,hallDown:false,ended:false,lvl:1,hpMul:1,dmgMul:1,onyx:{wave:1,base:onyxBase(),inter:0}};
  onyxMul(raid);raid.total=raid.queue.length;

  setMode();toast('The Onyx Trials begin: wave 1 of 10');
}

  const R=raid,O=R.onyx;
  if(O.inter>0){O.inter-=dt;if(O.inter<=0){O.wave++;onyxMul(R);R.spawns=[];for(let i=0;i<4;i++)R.spawns.push(edgePoint());R.queue=onyxQueue(O.wave,R.spawns);R.total=R.queue.length;R.t=0;
      toast(`Wave ${O.wave} of 10`);snd('horn');}return true;}
  if(R.hallDown||R.destroyed>=R.totalB){endOnyx(false,'Your Town Hall fell.');return true;}
  if(R.t>=R.dur&&(R.queue.length||R.units.length)){for(const u of R.units)puff(u.x,u.y,3,'#8a8a90');R.units=[];R.queue=[];floatText(N/2,N/2,50,'You held out: the rest retreat','#ffffff',18);}

function simStep(dt){
  const R=raid;
  if(R.onyx&&R.onyx.inter>0){onyxStep(dt);updateProj(dt);return;}
  if(R.stopT>0){R.stopT-=dt;const a=R.stopper;pathBudget=2;if(a&&!a.dead)updateUnit(a,dt);else R.stopT=0;updateFires(0);return;}
  R.t+=dt;
  while(R.queue.length&&R.queue[0].at<=R.t)spawnUnit(R.queue.shift());
  pathBudget=6;
  for(const u of R.units)updateUnit(u,dt);
  for(const tr of troops)updateTroopRaid(tr,dt);
  updateShrines(dt);
  updateTraps(dt);
  for(const b of S.b)updateDef(b,dt);
  updateProj(dt);updateFires(dt);updateWaves(dt);tickLasers(dt);for(const u of R.units)if(u.flash>0)u.flash-=dt;
  R.units=R.units.filter(u=>!u.dead);
  if(R.onyx&&onyxStep(dt))return;
  if(R.attack){attackTick(dt);if(R.destroyed>=R.totalB||R.t>=R.dur||(R.started&&!R.units.length&&!deployLeft()))return endAttack();return;}
  if(R.destroyed>=R.totalB)return endRaid();
  if(!R.queue.length&&!R.units.length)return endRaid();
  if(R.t>=R.dur)return endRaid();
}
function raidUpdate(dt){
  const R=raid;
  if(R.countdown>0){R.countdown-=dt;return;}
  const tot=dt*R.speed,steps=Math.ceil(tot/0.02),h=tot/steps;
  for(let i=0;i<steps&&!R.ended;i++)simStep(h);
}

      <p>${sub}</p>
      ${fought?`<p>${lostTxt?'Fallen defenders: '+lostTxt+'. Train more at the Barracks.':'All your defenders survived.'}</p>`:''}
      <div class="loot d sh"><span>${RI.gold} ${sg(dg)}</span><span>${RI.crystal} ${sg(dc)}</span><span>🏆 ${dT>=0?'+':'−'}${Math.abs(dT)}</span></div>

}

cv.addEventListener('pointerdown',e=>{

  }else if(!raid&&!cmd.open&&selected&&!selected.dead&&(pickAt(sx,sy,selected)===selected||groundAt(sx,sy)===selected)){

cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;

    case 'ghost':{const s=TYPES[placing.t].size;placing.x=clamp(Math.round(gp.x-gesture.off[0]),MARGIN,N-MARGIN-s);placing.y=clamp(Math.round(gp.y-gesture.off[1]),MARGIN,N-MARGIN-s);break;}

      if(gesture.group){const G=gesture.group,O=gesture.origs,i=G.indexOf(b);
        let dx=Math.round(gp.x-gesture.off[0])-O[i][0],dy=Math.round(gp.y-gesture.off[1])-O[i][1];
        const xs=O.map(o=>o[0]),ys=O.map(o=>o[1]);
        dx=clamp(dx,MARGIN-Math.min(...xs),N-MARGIN-1-Math.max(...xs));dy=clamp(dy,MARGIN-Math.min(...ys),N-MARGIN-1-Math.max(...ys));

function endPointer(e,cancel){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);cv.style.cursor='grab';
  if(pinch){if(ptrs.size<2)pinch=null;gesture=null;return;}
  const G=gesture;gesture=null;if(!G)return;
  if(G.hold){clearTimeout(G.hold);if(G.rep)clearInterval(G.rep);if(G.dropping)return;}
  if(G.type==='move'&&G.group){const ig=new Set(G.group),ok=!cancel&&G.group.every(w=>canPlace('wall',w.x,w.y,ig));
    for(const w of G.group)delete w.conn;
    if(ok){rebuildOcc();saveSoon();snd('place');}else{G.group.forEach((w,j)=>{w.x=G.origs[j][0];w.y=G.origs[j][1];});if(!cancel)toast('That spot is blocked');}
    selSig='';return;}
  if(G.type==='move'){const b=G.b;
    if(!cancel&&canPlace(b.t,b.x,b.y,b)){rebuildOcc();saveSoon();if(TYPES[b.t].cat==='army')for(const tr of troops)tr.post=null;}
    else{b.x=G.orig[0];b.y=G.orig[1];if(!cancel)toast('That spot is blocked');}return;}
  if(G.type==='paint'){if(placing)placing.last=null;return;}
  if(!cancel&&!G.moved)handleTap(e.clientX,e.clientY);
}
cv.addEventListener('pointerup',e=>endPointer(e,false));
cv.addEventListener('pointercancel',e=>endPointer(e,true));

let lastTap=null,selStack=false;
function handleTap(sx,sy){
  if(placing){if(!placing.wall){const s=TYPES[placing.t].size,gp=toGrid(sx,sy);placing.x=clamp(Math.floor(gp.x)-Math.floor(s/2),MARGIN,N-MARGIN-s);placing.y=clamp(Math.floor(gp.y)-Math.floor(s/2),MARGIN,N-MARGIN-s);}return;}
  if(inAttack()){deployAt(sx,sy);return;}
  if(cmd.open){cmdTap(sx,sy);return;}
  if(!raid)for(const b of S.b){if(b._bub&&Math.hypot(sx-b._bub[0],sy-b._bub[1])<22){collect(b);return;}}
  const t=performance.now();
  // a selected building that is shown through a faded building stays selected when tapped
  if(selected&&isHidden(selected)&&pickAt(sx,sy,selected)===selected){
    if(!raid&&TYPES[selected.t].rate&&selected.st>=1)collect(selected);lastTap={sx,sy,t};return;}
  const {first,list}=stackAt(sx,sy);
  const again=lastTap&&Math.hypot(sx-lastTap.sx,sy-lastTap.sy)<28&&t-lastTap.t<5000;
  let b=first;
  if(again&&selected&&list.length>1&&list.includes(selected))b=list[(list.indexOf(selected)+1)%list.length];
  lastTap={sx,sy,t};
  if(b&&!raid&&TYPES[b.t].rate&&b.st>=1&&selected!==b)collect(b);
  select(b);selStack=!!b&&b===first&&list.length>1;selSig='';renderSel();
}

function statList(b){
  const T=TYPES[b.t],L=b.lvl-1,o=[];
  if(T.cat==='trap'){
    if(b.t==='bomb')o.push(['Damage',fmt(T.dmg[L])],['Blast radius',T.radius]);
    if(b.t==='spring')o.push(['Launches',T.fling[L]+' raiders']);
    if(b.t==='tar')o.push(['Slow',Math.round(T.slow[L]*100)+'%'],['Lasts',T.dur[L]+'s']);
    o.push(['Visible to raiders','No']);return o;}
  o.push(['HP',raid?`${fmt(Math.max(0,Math.ceil(b.hp)))}/${fmt(maxHp(b))}`:fmt(maxHp(b))]);
  if(b.t==='garrison'){o.push(['Houses',T.house[L]]);o.push(['Army',houseUsed()+' / '+houseCap()]);}
  if(b.t==='barracks'){const un=Object.values(TROOPS).filter(t=>t.lvl<=b.lvl).length;o.push(['Troop types',un+' / '+Object.keys(TROOPS).length]);if(b.lvl>1)o.push(['Troop power','+'+Math.round((b.lvl-1)*8)+'%']);}
  if(b.t==='bell')o.push(['Stun',T.stun[L]+'s']);
  if(b.t==='shrine')o.push(['Heals troops',T.heal[L]+'/s'],['Mends buildings',T.mend[L]+'/s'],['Radius',T.hr[L]]);
  if(b.t==='armory')o.push(['Troops up to',`Lv ${troopCap()}`]);
  if(b.t==='stable')o.push(['Cavalry speed','+'+Math.round((b.lvl-1)*6)+'%']);
  if(TYPES[b.t].cat==='onyx')o.push(['Stored',fmt(b.st)],['Protection','Can\'t be raided']);
  if(b.t==='dock'){const bt=boatOf(S.boat);o.push(['Boat',bt?bt.name:'None'],['Carries',bt?bt.cap+' housing':'—']);}
  if(T.cat==='def'){o.push(['Damage/sec',(T.dmg[L]/T.fire).toFixed(1)]);o.push(['Range',T.range+(T.minRange?` (min ${T.minRange})`:'')]);}
  if(T.rate){o.push(['Rate',fmt(T.rate[L]*60)+'/min']);o.push(['Stored',fmt(b.st)+' / '+fmt(T.store[L])]);}
  if(T.stores)o.push(['Holds',fmt(T.cap[L])]);
  if(b.t==='hall')o.push(['Holds',fmt(T.cap[L])+' of each']);
  if(b.t==='hut'){const bl=builders();o.push(['Builders free',bl.free+' / '+bl.total]);}
  return o;
}

// ================= global leaderboard =================
// Scores are worked out here for display and again on the server from the submitted base, with the same formula.
const LB_API=(()=>{try{return localStorage.getItem('bulwark-lb-api')||'https://leaderboard.hunteracedev.com';}catch(e){return 'https://leaderboard.hunteracedev.com';}})();
const LB_VALUE={hall:320,hut:30,wall:6,cannon:120,archer:130,mortar:160,mage:170,ballista:170,flame:170,catapult:200,bell:180,bomb:40,spring:45,tar:50,
  goldmine:60,crystalmine:60,goldvault:70,crystalvault:70,barracks:150,garrison:120,armory:120,stable:120,shrine:130,dock:110};
const LB_HOUSE={footman:1,spearman:2,crossbow:2,longbow:2,knight:3,cavalier:6,templar:5,paladin:10,bomber:2,bowman:2,xbowman:2,hunter:3,tank:6};
const lbLvl=l=>1+0.35*(l-1)+0.05*(l-1)*(l-1);
function baseSnapshot(){return{b:S.b.filter(b=>TYPES[b.t].cat!=='onyx').map(b=>[b.t,b.x,b.y,b.lvl]),army:Object.assign({},S.army),tlvl:Object.assign({},S.tlvl),trophies:S.trophies|0,raidMax:S.raidMax|0};}
function scoreBase(base){
  const b=base.b,hall=b.find(x=>x[0]==='hall'),hallLvl=hall?hall[3]:1;
  let buildings=0,walls=0,defense=0;const occ=new Map(),nonWall=[],defs=[];
  for(const [t,x,y,l] of b){const T=TYPES[t];if(!T)continue;const v=(LB_VALUE[t]||50)*lbLvl(l);
    if(t==='wall')walls+=v;else if(T.cat==='def')defense+=v;else buildings+=v;
    for(let j=0;j<T.size;j++)for(let i=0;i<T.size;i++)occ.set((y+j)*N+x+i,t);
    if(t!=='wall'&&T.cat!=='trap')nonWall.push([t,x,y,l,T.size]);
    if(T.cat==='def')defs.push([x+T.size/2,y+T.size/2,T.range]);}
  const reach=new Uint8Array(N*N),stack=[];
  for(let i=0;i<N;i++)for(const k of [i,i+N*(N-1),i*N,i*N+N-1])if(!reach[k]&&occ.get(k)!=='wall'){reach[k]=1;stack.push(k);}
  while(stack.length){const k=stack.pop(),x=k%N,y=(k/N)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=N||ny>=N)continue;const nk=ny*N+nx;if(reach[nk])continue;
      const o=occ.get(nk);if(o==='wall')continue;reach[nk]=1;if(!o||TYPES[o].cat==='trap')stack.push(nk);}}
  let protectedN=0,covered=0;
  for(const [t,x,y,l,s] of nonWall){let hit=false;for(let j=0;j<s&&!hit;j++)for(let i=0;i<s&&!hit;i++)if(reach[(y+j)*N+x+i])hit=true;if(!hit)protectedN++;
    const cx=x+s/2,cy=y+s/2;if(defs.some(d=>Math.hypot(d[0]-cx,d[1]-cy)<=d[2]))covered++;}
  const structure=Math.round(protectedN*45+(nonWall.length?covered/nonWall.length:0)*300);
  let army=0;for(const t in base.army||{}){if(!LB_HOUSE[t])continue;const n=Math.max(0,base.army[t]|0),tl=Math.max(1,Math.min(10,(base.tlvl||{})[t]|0||1));army+=n*LB_HOUSE[t]*14*(1+0.12*(tl-1));}
  const parts={buildings:Math.round(buildings),defense:Math.round(defense),walls:Math.round(walls),structure,army:Math.round(army),trophies:Math.max(0,base.trophies|0)*3,raids:Math.max(0,Math.min(150,base.raidMax|0))*25};
  return{total:Object.values(parts).reduce((a,v)=>a+v,0),parts,hallLvl,protectedN,covered,nonWall:nonWall.length};
}

function botBase(hl){
  const out=[],taken=new Set(),rnd=Math.random;
  const maxL=t=>TYPES[t].cat==='trap'?Math.min(8,hl+1):t==='hut'?1:t==='hall'?hl:Math.min(TYPES[t].maxLvl,hl+1);
  const lv=t=>t==='hall'?hl:clamp(hl+Math.floor(rnd()*3)-1,1,maxL(t));
  const free=(x,y,s,gap)=>{if(x<MARGIN||y<MARGIN||x+s>N-MARGIN||y+s>N-MARGIN)return false;for(let j=-gap;j<s+gap;j++)for(let i=-gap;i<s+gap;i++)if(taken.has((y+j)*N+x+i))return false;return true;};
  const put=(t,x,y)=>{const s=TYPES[t].size;for(let j=0;j<s;j++)for(let i=0;i<s;i++)taken.add((y+j)*N+x+i);out.push([t,x,y,lv(t)]);};
  const place=(t,gap,cx,cy)=>{const s=TYPES[t].size;cx=cx==null?N/2:cx;cy=cy==null?N/2:cy;
    for(let r=0;r<22;r++){const c=[];for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(Math.max(Math.abs(dx),Math.abs(dy))===r)c.push([dx,dy]);
      c.sort(()=>rnd()-0.5);for(const [dx,dy] of c){const x=Math.round(cx-s/2+dx),y=Math.round(cy-s/2+dy);if(free(x,y,s,gap)){put(t,x,y);return true;}}}return false;};

  let x0=99,y0=99,x1=0,y1=0;for(const [t,x,y] of out){const s=TYPES[t].size;x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+s);y1=Math.max(y1,y+s);}

  place('hut',1);place('hut',1);
  {const side=Math.floor(rnd()*4);for(let tries=0;tries<30;tries++){const k=MARGIN+Math.floor(rnd()*(N-2*MARGIN-3));const x=side===0?MARGIN:side===1?N-MARGIN-3:k,y=side===2?MARGIN:side===3?N-MARGIN-3:k;if(free(x,y,3,0)){put('dock',x,y);break;}}}
  for(const t of ['bomb','spring','tar'])for(let i=0;i<n(t);i++){const a=rnd()*TAU,r=(x1-x0)/2+1.5+rnd()*2.5;place(t,0,N/2+Math.cos(a)*r,N/2+Math.sin(a)*r);}

  let room=out.filter(e=>e[0]==='garrison').reduce((a,e)=>a+TYPES.garrison.house[e[3]-1],0);

  return{b:out,army,tlvl};
}

  if(R.red[ty*N+tx]){toast('Too close to their buildings. Deploy outside the red area.');R.redFlash=1;snd('error');return false;}
  const t=atkSel,d=TROOPS[t],m=R.mult[t]||1,tl=R.tl[t]||1;
  if(R.boatUsed+d.house>R.boatCap){toast(`Your ${boatOf(R.boat)?boatOf(R.boat).name:'boat'} only carries ${R.boatCap} housing. Buy a bigger boat at the Dock.`);snd('error');return false;}
  const def=Object.assign({},d,{shot:d.shot||null,pref:d.pref||null});
  if(d.blast){def.blast=d.blast*m*(tl>=4?2:1);def.radius=tl>=4?2.3:1.6;}
  if(d.fire&&tl>=4)def.fireDps=d.fire*m;
  R.boatUsed+=d.house;
  R.units.push({id:uid++,type:t,isTroop:true,tl,def,
    x:clamp(gp.x,0.2,N-0.2),y:clamp(gp.y,0.2,N-0.2),hp:d.hp*m,maxHp:d.hp*m,dps:d.dps*m,speed:d.speed*(0.95+Math.random()*0.1),range:d.range,
    target:null,path:null,pi:0,needPath:true,cd:Math.random()*0.3,dir:1,walk:Math.random()*5,dead:false,hitFlash:0,swing:0,moving:false,rp:0,
    foe:null,scan:0,slowT:0,slowF:0,ox:(Math.random()-.5)*0.25,oy:(Math.random()-.5)*0.25});
  R.left[t]--;R.deployed[t]=(R.deployed[t]||0)+1;R.started=true;puff(gp.x,gp.y,3,'#e8d6b0');snd('click');
  if(!(R.left[t]>0)){const nxt=Object.keys(R.left).find(k=>R.left[k]>0);atkSel=nxt||null;}
  renderDeploy();return true;
}
let deploySig='';
function renderDeploy(){
  const el=$('deploy');
  if(!inAttack()||raid.ended){el.hidden=true;deploySig='';return;}
  el.hidden=false;const R=raid,types=Object.keys(R.left);
  const sig=types.map(t=>t+':'+R.left[t]).join(',')+'|'+atkSel+'|'+R.boatUsed;if(sig===deploySig)return;deploySig=sig;
  const bt=boatOf(R.boat);
  el.innerHTML=`<div class="dep-top"><div class="dep-hint">${deployLeft()?'Pick a troop, then tap the grass outside the red area. Hold to drop several.':'All troops deployed.'}<br><span class="dep-boat">⛵ ${bt?bt.name:'Boat'}: ${R.boatUsed} / ${R.boatCap} housing used</span></div>
      <button class="btn red dep-end" data-d="end">End battle</button></div>
    <div class="cmd-chips">${types.map(t=>`<button class="cchip${t===atkSel?' on':''}${R.left[t]>0?'':' out'}" data-dt="${t}" aria-label="${TROOPS[t].name}"><canvas width="68" height="68" data-ti="${t}"></canvas>×${R.left[t]}</button>`).join('')}</div>`;
  el.querySelectorAll('canvas[data-ti]').forEach(c=>troopIcon(c,c.dataset.ti));
}
function attackTick(dt){
  const R=raid;
  for(const u of R.units){if(u.dead)continue;const tl=u.tl||1;
    if(u.def.heal){u.healT=(u.healT||1)-dt;if(u.healT<=0){u.healT=1;let any=false;
      for(const o of R.units)if(!o.dead&&o.hp<o.maxHp&&Math.hypot(o.x-u.x,o.y-u.y)<=3){o.hp=Math.min(o.maxHp,o.hp+u.def.heal*(R.mult[u.type]||1));any=true;}
      if(any)addFx({k:'ring',x:u.x,y:u.y,T:0.6,r:3,c:'rgba(255,225,120,.75)'});}}
    if(u.type==='hunter'&&tl>=4&&!u.berserked&&u.hp<u.maxHp*0.45){u.berserked=true;u.berserk=8;u.dps*=1.8;u.speed*=1.5;floatText(u.x,u.y,26,'Berserk!','#ff6a4d',18);addFx({k:'ring',x:u.x,y:u.y,T:0.5,r:1.2,c:'rgba(255,90,60,.95)'});snd('horn',u.x,u.y);}
    if(u.berserk>0){u.berserk-=dt;if(u.berserk<=0){u.dps/=1.8;u.speed/=1.5;}else if(Math.random()<dt*10)addFx({k:'spark',x:u.x+(Math.random()-.5)*0.5,y:u.y+(Math.random()-.5)*0.5,z:8+Math.random()*16,vz:30,T:0.5});}
    if(u.type==='tank'&&tl>=4&&!u.shielded&&u.hp<u.maxHp*0.5){u.shielded=true;u.shield=7;floatText(u.x,u.y,30,'Tank mode!','#7fd0ff',18);snd('bell',u.x,u.y);}
    if(u.shield>0){u.shield-=dt;if(Math.random()<dt*6)addFx({k:'ring',x:u.x,y:u.y,T:0.5,r:0.9,c:'rgba(120,200,255,.8)'});}
  }
  for(const b of S.b){if(!b.burn||b.dead)continue;b.burn.t-=dt;hitBuilding(b,b.burn.dps*dt);
    if(Math.random()<dt*8){const [cx,cy]=centerOf(b),s=TYPES[b.t].size;addFx({k:'fire',x:cx+(Math.random()-.5)*s*0.7,y:cy+(Math.random()-.5)*s*0.7,z:6+Math.random()*12,T:0.35,r:5+Math.random()*4});}
    if(b.burn.t<=0)b.burn=null;}
}
function endAttack(quit){
  const R=raid;if(!R||R.ended)return;R.ended=true;
  const stars=raidStars(R),pct=Math.round(R.destroyed/Math.max(1,R.totalB)*100),hl=R.opp.hall||1;
  const bonus=stars*Math.round(120*hl*(1+hl/6)),used=Object.values(R.deployed).reduce((a,n)=>a+n,0);
  const gG=R.gotG+bonus,gC=R.gotC+bonus;
  const dT=!used?0:stars?[0,8,16,25][stars]:-10;
  R.result={stars,pct,gG,gC,dT,used};renderDeploy();
  setTimeout(()=>snd(stars?'win':'lose'),400);
  const usedTxt=Object.entries(R.deployed).filter(e=>e[1]>0).map(([t,n])=>`${n} ${TROOPS[t].name}${n>1?(t==='footman'?'':'s'):''}`).join(', ');
  setTimeout(()=>{
    showModal(`<h2 class="sh">${stars?'Victory!':'Defeat'}</h2>
      <div class="bigstars stars">${[0,1,2].map(i=>`<span class="${i<stars?'on':''}">★</span>`).join('')}</div>
      <p>${pct}% of ${esc(R.opp.name)}'s base destroyed</p>
      <div class="loot d sh"><span>${RI.gold} +${fmt(gG)}</span><span>${RI.crystal} +${fmt(gC)}</span><span>🏆 ${dT>=0?'+':'−'}${Math.abs(dT)}</span></div>
      <p>${usedTxt?`Troops used: ${usedTxt}. Deployed troops don't come back, so train more at the Barracks.`:'You didn\'t deploy any troops.'}</p>
      <div class="mrow"><button class="btn" data-m="done">Return home</button></div>`,{done:finishAttack});
  },700);
}
function finishAttack(){
  const R=raid,res=R.result||{gG:0,gC:0,dT:0};
  raid=null;fx.length=0;floats.length=0;
  S.b=homeBackup.b;troops=homeBackup.troops;S.tlvl=homeBackup.tlvl;S.army=homeBackup.army;S.posts=homeBackup.posts;
  cam.x=homeBackup.cam.x;cam.y=homeBackup.cam.y;cam.z=homeBackup.cam.z;homeBackup=null;
  rebuildOcc();
  for(const t in R.deployed){S.army[t]=Math.max(0,(S.army[t]||0)-R.deployed[t]);if(!S.army[t])delete S.army[t];}
  syncTroops();for(const tr of troops){tr.hp=tr.maxHp;tr.foe=null;tr.path=null;tr.order=null;}
  S.gold=Math.min(cap('gold'),S.gold+res.gG);S.crystal=Math.min(cap('crystal'),S.crystal+res.gC);
  S.trophies=Math.max(0,S.trophies+res.dT);
  hideModal();setMode();renderDeploy();save();
  const lp=lbPlayer();if(lp.name.length>=2&&lp.submitted&&!lp.optOut&&lbStatus!=='offline')setTimeout(()=>lbSubmit(true),1200);
}

// ================= developer tools (unlocked with a passcode, saved only on this device) =================
const DEV_KEY='bulwark-dev',DEV_HASH='f6342118d77c2e8380e8d523e8f6f23aea3408c3e3bf7ad456ff235aeffcaa00',DEV_INF=999999999;
const DEV=(()=>{try{return Object.assign({on:false,inf:false,fast:false,fps:false},JSON.parse(localStorage.getItem(DEV_KEY)||'{}'));}catch(e){return{on:false,inf:false,fast:false};}})();
const devInf=()=>DEV.on&&DEV.inf,devFast=()=>DEV.on&&DEV.fast;
function devSave(){try{localStorage.setItem(DEV_KEY,JSON.stringify(DEV));}catch(e){}$('devTag').hidden=!DEV.on;}
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function devTick(){
  if(DEV.on&&!S.devUsed){S.devUsed=true;saveSoon();}
  if(devInf()){S.gold=DEV_INF;S.crystal=DEV_INF;}
  if(devFast()){for(const b of S.b)if(b.bu)finishBusy(b);if(S.train.q.length&&barracksLvl())S.train.t0=1;if(S.research)S.research.end=0;}
}
function showDevUnlock(){
  showModal(`<h2 class="sh">Developer mode</h2><p>Enter your passcode.</p>
    <input class="pin" id="devPin" type="password" autocomplete="off" aria-label="Passcode">
    <div class="mrow"><button class="btn plain" data-m="close">Cancel</button><button class="btn" data-m="unlock">Unlock</button></div>`,{
    close:hideModal,
    unlock:async()=>{const v=($('devPin').value||'').trim();let h='';try{h=await sha256(v);}catch(e){toast('This browser can’t check the passcode here');return;}
      if(h!==DEV_HASH){toast('Wrong passcode');$('devPin').value='';return;}
      DEV.on=true;S.devUsed=true;saveSoon();devSave();toast('Developer mode on');showDevTools();}});
  setTimeout(()=>{const i=$('devPin');if(i){i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')modalHandlers.unlock();});}},50);
}
function showDevTools(){
  const tg=(k,label,on)=>`<button class="btn ${on?'':'plain'}" data-m="${k}">${label}<small>${on?'On':'Off'}</small></button>`;
  showModal(`<h2 class="sh">Developer tools</h2><p>These only affect your game on this device.</p>
    <div class="tips" style="gap:10px">
      ${tg('inf','Infinite resources',DEV.inf)}
      ${tg('fast','Instant builds, upgrades & training',DEV.fast)}
      ${tg('fps','Show frame rate',DEV.fps)}
      <button class="btn blue" data-m="raids">Unlock all raid levels</button>
      <button class="btn plain" data-m="lbapi">Leaderboard server<small>${LB_API}</small></button>
      <button class="btn red" data-m="lock">Turn off developer mode</button>
      <button class="btn plain" data-m="close">Close</button></div>`,{
    close:hideModal,
    inf:()=>{DEV.inf=!DEV.inf;if(!DEV.inf){S.gold=cap('gold');S.crystal=cap('crystal');}devSave();saveSoon();showDevTools();},
    fast:()=>{DEV.fast=!DEV.fast;devSave();showDevTools();},
    fps:()=>{DEV.fps=!DEV.fps;devSave();showDevTools();},
    raids:()=>{S.raidMax=150;saveSoon();toast('All raid levels unlocked');},
    lbapi:()=>{showModal(`<h2 class="sh">Leaderboard server</h2><p>The web address of your leaderboard Worker. Leave it as the default unless you set the Worker up under a different address.</p>
      <input class="pin" id="lbApiIn" value="${esc(LB_API)}" autocomplete="off"><div class="mrow"><button class="btn plain" data-m="back">Cancel</button><button class="btn" data-m="save">Save &amp; reload</button></div>`,{
      back:()=>showDevTools(),save:()=>{let v=($('lbApiIn').value||'').trim().replace(/\/+$/,'');try{if(v)localStorage.setItem('bulwark-lb-api',v);else localStorage.removeItem('bulwark-lb-api');}catch(e){}save();location.reload();}});},
    lock:()=>{if(DEV.inf){S.gold=cap('gold');S.crystal=cap('crystal');}DEV.on=false;DEV.inf=false;DEV.fast=false;devSave();saveSoon();hideModal();toast('Developer mode off');}});
}
let verTaps=0,verT=0;
// ================= loop =================
let lastT=performance.now(),uiAcc=0,saveAcc=0;
function frame(t){
  const fd=t-lastT,dt=Math.min(0.05,fd/1000);lastT=t;tSec+=dt;now=Date.now();perfTick(fd);
  devTick();if(!homeBackup){economy(dt);processTraining();processResearch();}
  if(raid&&!raid.ended)raidUpdate(dt);else if(!raid)updateIdleTroops(dt);
  updateFx(dt);
  render();
  uiAcc+=dt;if(uiAcc>0.2){uiAcc=0;updateHud();renderSel();if(shopOpen)renderShop(false);if(trainOpen)renderTrain();renderCmd();}
  saveAcc+=dt;if(saveFlag||saveAcc>6){if(saveFlag||saveAcc>6){saveFlag=false;saveAcc=0;save();}}
  requestAnimationFrame(frame);
}
addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
addEventListener('pagehide',save);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTheme);}catch(e){}

// ================= boot =================
readTheme();resize();
const fresh=!load();if(fresh)newGame();
S.b.forEach(initRt);rebuildOcc();syncTroops();for(const tr of troops){const p=troopPost(tr);tr.x=p[0];tr.y=p[1];}centerCam();updateHud();setMode();
if(S.rebal){delete S.rebal;S.raidLvl=clamp(recommended(),1,S.raidMax);save();setTimeout(()=>toast(`Raids were rebalanced. You're now on Lv ${S.raidLvl}. Pick any unlocked level from the Raid button.`),800);}
devSave();updateHud();
requestAnimationFrame(t=>{lastT=t;frame(t);});
if(!S.seen)showWelcome();
})();
</script>
